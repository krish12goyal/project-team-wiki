<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Team Wiki</title>
  <link rel="stylesheet" href="/css/modern-styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <div class="auth-card__logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <h1 class="auth-card__title">Choose a new password</h1>
        <p class="auth-card__subtitle">Please enter your new password below</p>
      </div>

      <form id="reset-form" class="auth-form">
        <div class="form-group">
          <label class="form-group__label" for="password">New Password</label>
          <input 
            type="password" 
            id="password" 
            class="input" 
            placeholder="At least 6 characters"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label class="form-group__label" for="confirm-password">Confirm Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            class="input" 
            placeholder="Re-enter your password"
            required
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn--primary w-full" id="submit-btn">
          Update Password
        </button>
      </form>

      <div class="auth-card__footer">
        <p>Back to <a href="/login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script>
    let token = null;

    // Get token from URL query parameters on load
    window.addEventListener('DOMContentLoaded', () => {
      token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        showToast('Reset token is missing or invalid.', 'error');
        document.getElementById('submit-btn').disabled = true;
      }
    });

    // Form submission
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const submitBtn = document.getElementById('submit-btn');

      if (!token) {
        showToast('Token is missing.', 'error');
        return;
      }
      
      if (password.length < 6) {
        showToast('Password must be at least 6 characters long', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const data = await WikiAPI.resetPassword(token, password);
        showToast(data.message || 'Password updated successfully.', 'success');
        
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 2000);
      } catch (err) {
        showToast(err.message || 'Failed to reset password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });

    // Toast function
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast--${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4500);
    }
  </script>
</body>
</html>
