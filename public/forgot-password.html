<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Team Wiki</title>
  <link rel="stylesheet" href="/css/modern-styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <div class="auth-card__logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <h1 class="auth-card__title">Reset Password</h1>
        <p class="auth-card__subtitle">Enter your email and we'll log a reset link to the server console</p>
      </div>

      <form id="forgot-form" class="auth-form">
        <div class="form-group">
          <label class="form-group__label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="input" 
            placeholder="Enter your registered email"
            required
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn btn--primary w-full" id="submit-btn">
          Send Reset Link
        </button>
      </form>

      <div class="auth-card__footer">
        <p>Back to <a href="/login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script>
    // Form submission
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      
      if (!email) {
        showToast('Please enter your email', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      try {
        const data = await WikiAPI.forgotPassword(email);
        showToast(data.message || 'Reset link logged to console.', 'success');
        
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 3000);
      } catch (err) {
        showToast(err.message || 'Failed to request password reset', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });

    // Toast function
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast--${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4500);
    }
  </script>
</body>
</html>
